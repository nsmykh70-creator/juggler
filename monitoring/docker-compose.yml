# Juggler monitoring stack (local/dev).
#
# Usage:
#   docker compose -f monitoring/docker-compose.yml up -d
#   Grafana  -> http://localhost:3300  (admin / admin, change on first login)
#   Prometheus UI -> http://localhost:9092  (targets: up:9091 - 5m 90s)
#
# Stop: docker compose -f monitoring/docker-compose.yml down
# (prometheus/grafana data live in named volumes, survive restarts)

services:
  # Scrapes Juggler's /metrics over the data-plane TLS port (default up:443
  # via host-gateway, i.e. the Docker Desktop host; on Linux override the
  # target in monitoring/prometheus.yml, e.g. 172.17.0.1:443).
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: juggler-prometheus
    volumes:
      - prom_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9092:9090"   # Prometheus UI (9090/9091 may be taken by Juggler admin)
    extra_hosts:
      - "up:host-gateway"
    restart: unless-stopped

  # Dashboard is provisioned automatically (monitoring/provisioning):
  # datasource DS_JUGGLER -> prometheus (uid juggler-main), dashboard JSON
  # shared with docs/grafana-dashboard.json (build/ strips __inputs).
  grafana:
    image: grafana/grafana:11.1.0
    container_name: juggler-grafana
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_NEWS_FEED_URL=""
      - GF_ANALYTICS_REPORTING_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3300:3000"
    extra_hosts:
      - "up:host-gateway"
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
