name: Juggler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  tests:
    name: Unit tests (cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc (build.rs falls back to system protoc on Linux)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      # Run the suite several times: the balancer uses random tie-breaks.
      - run: |
          cargo test --release
          cargo test --release
          cargo test --release

  integration:
    name: Integration tests (build, run, probe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protoc (vendored binary is win64-only)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - run: cargo build --release

      - name: Install python test dependencies
        run: pip install requests urllib3 grpcio grpcio-tools "httpx[http2]"

      - name: Start mock backends
        run: |
          python mock_backends.py > mock.log 2>&1 &
          sleep 1

      - name: Start server
        run: |
          # CI proxies to loopback mock backends and exercises the admin API:
          # opt out of the egress guard and give the fail-closed admin a token.
          JUGGLER_ALLOW_PRIVATE_UPSTREAMS=1 \
          JUGGLER_ADMIN_TOKEN=ci-admin-token \
          ./target/release/juggler > server.log 2>&1 &
          sleep 2

      - name: Run integration tests
        run: python integration_tests.py
        env:
          # Env-prefix on the server step applies only to that command; the
          # test process needs the token too (admin API + gRPC mutations).
          JUGGLER_CI_ADMIN_TOKEN: ci-admin-token

      - name: Verify route persistence across restart
        run: |
          pkill -TERM juggler || true
          sleep 1
          # Same env as the start-server step: the restored /api route proxies
          # to loopback mocks, which the egress guard would otherwise reject.
          JUGGLER_ALLOW_PRIVATE_UPSTREAMS=1 \
          JUGGLER_ADMIN_TOKEN=ci-admin-token \
          ./target/release/juggler > server2.log 2>&1 &
          sleep 2
          grep -q "Restored" server2.log
          # -L: exact-match proxy routes answer 301 -> /api/ (nginx
          # directory-location semantics); the persistence assertion is that
          # the restored route serves traffic after a restart.
          code=$(curl -skL https://127.0.0.1:8443/api -o /dev/null -w "%{http_code}")
          test "$code" = "200"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            server.log
            server2.log
            mock.log

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [tests, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false          # set true + registry login to publish
          tags: juggler-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
