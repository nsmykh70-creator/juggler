version: "3.8"

services:
  # The web server itself.
  juggler:
    build: .
    container_name: juggler
    ports:
      - "8443:8443"    # Data Plane (HTTPS)
      - "50051:50051"  # Control Plane (gRPC)

  # Scrapes /metrics from the server every 5 seconds.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: juggler-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux: reach host-run servers

  # Dashboards at http://localhost:3000 (admin/admin).
  grafana:
    image: grafana/grafana:11.3.0
    container_name: juggler-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
