<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site_title}} | 404 - Страница не найдена</title>
    <link href="{{google_fonts_url}}" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f1c40f;
            --dark-bg: #1c1406;
            --light-text: #fef9e7;
            --gradient: linear-gradient(135deg, #f1c40f, #e67e22);
            --font-headers: '{{font_headers}}', sans-serif;
            --font-body: '{{font_body}}', sans-serif;
        }
        body {
            font-family: var(--font-body);
            color: var(--light-text);
            background: var(--dark-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
        }
        h1 {
            font-family: var(--font-headers);
            font-size: 6rem;
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.3);
        }
        h2 {
            font-family: var(--font-headers);
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .btn-theme {
            background: var(--gradient);
            border: none;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            font-family: var(--font-headers);
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3);
            transition: all 0.3s ease;
        }
        .btn-theme:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 20px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>{{page_title}}</h2>
        <p>{{page_content}}</p>
        <a href="?page=home" class="btn-theme">Вернуться на главную</a>
    </div>
</body>
</html>
