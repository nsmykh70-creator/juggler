<head>

    <link rel="stylesheet" href="assets/css/tailwind-shim.css?v=20260724">

    <title>{{site_title}} | Солнечное Сияние</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #f1c40f;
            --primary-light: #f39c12;
            --secondary: #e67e22;
            --dark-bg: #1c1406;
            --light-text: #fef9e7;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));
            --font-headers: '{{font_headers}}', sans-serif;
            --font-body: '{{font_body}}', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--light-text); overflow-x: clip; background: var(--dark-bg); min-height: 100vh; background-image: radial-gradient(circle at 50% 20%, rgba(241, 196, 15, 0.2) 0%, transparent 30%), radial-gradient(circle at 50% 80%, rgba(230, 126, 34, 0.2) 0%, transparent 30%); background-attachment: fixed; position: relative; display: flex; flex-direction: column; }
        .main-content { flex: 1; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
        .sun-ray { position: absolute; width: 4px; height: 100px; background: linear-gradient(to bottom, rgba(241, 196, 15, 0.8), transparent); animation: ray 8s linear infinite; opacity: 0.7; z-index: -1; border-radius: 2px; top: 0; left: 50%; }
        @keyframes ray { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.7; } 90% { opacity: 0.7; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: var(--glass-shadow); padding: 2rem; margin-bottom: 2rem; transition: all 0.5s ease; }
        h1, h2, h3, h4, h5, h6 { font-family: var(--font-headers); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .hero-title { font-size: 3.5rem; line-height: 1.1; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1.5rem; text-shadow: 0 0 15px rgba(241, 196, 15, 0.3); }
        .btn-theme { background: var(--gradient); border: none; color: white; padding: 0.8rem 2rem; border-radius: 50px; font-weight: 600; position: relative; overflow: hidden; transition: all 0.3s ease; font-family: var(--font-headers); text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 5px 15px rgba(241, 196, 15, 0.3); }
        .btn-theme:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2), 0 0 20px rgba(241, 196, 15, 0.4); }
        .navbar { background: rgba(28, 20, 6, 0.85); backdrop-filter: blur(10px); transition: all 0.4s ease; border-bottom: 1px solid rgba(241, 196, 15, 0.2); }
        .navbar-brand { font-family: var(--font-headers); font-weight: 700; font-size: 1.8rem; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-link { font-family: var(--font-headers); font-weight: 500; position: relative; margin: 0 0.5rem; padding: 0.5rem 0; color: var(--light-text) !important; transition: all 0.3s ease; }
        .nav-link:after { content: ''; position: absolute; width: 0; height: 3px; bottom: 0; left: 0; background: var(--gradient); transition: width 0.3s ease; }
        .nav-link:hover:after, .nav-link.active:after { width: 100%; }
        .hero-section { min-height: 100vh; align-items: center; position: relative; padding-top: 80px; }
        .footer { background: rgba(28, 20, 6, 0.95); padding: 3rem 0; position: relative; border-top: 1px solid rgba(241, 196, 15, 0.2); text-align: center; }
        .fade-in-section { opacity: 0; transform: translateY(30px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .fade-in-section.is-visible { opacity: 1; transform: translateY(0); }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; padding: 20px 0; }
        .pagination .btn { min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; padding: 0; }
        .pagination .btn.active { box-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .news-item { margin-bottom: 40px; transition-delay: calc(var(--index) * 0.1s); }
        .news-date { color: var(--primary); font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .news-content { font-family: 'Open Sans', sans-serif; line-height: 1.7; }
        .hero-section { display: none; }
        .page-home .hero-section { display: flex; }
    

        .news-blog-container .news-item { margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .news-blog-container .news-item:last-child { border-bottom: 0; padding-bottom: 0; margin-bottom: 0; }
        .news-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; }
        .news-date { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1rem; }
        .news-content-full { line-height: 1.75; }
        .news-content-full p { margin-bottom: 1rem; }
        .news-content-full h2, .news-content-full h3 { margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .news-content-full img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
        .news-content-full ul, .news-content-full ol { margin: 0 0 1rem 1.5rem; }
        .news-content-full li { margin-bottom: 0.4rem; }
        .news-content-full pre { background: rgba(0,0,0,0.06); padding: 1rem; border-radius: 8px; overflow-x: auto; max-width: 100%; }
        .news-content-full code { font-family: 'Fira Code', monospace; font-size: 0.9em; }
        .news-content-full blockquote { border-left: 3px solid #2563eb; padding-left: 1rem; margin: 1rem 0; opacity: 0.85; font-style: italic; }
        .news-content-full table { display: block; overflow-x: auto; max-width: 100%; }
        .lumina-toggle-block[data-lumina-toggle] { display: block; margin: 1rem 0; }
        .toggle-news-btn { cursor: pointer; transition: filter 0.15s ease, transform 0.1s ease; }
        .toggle-news-btn:hover { filter: brightness(1.1); }
        .toggle-news-btn:active { transform: translateY(1px); }
        .lumina-toggle-content { margin-top: 1rem; animation: luminaToggleFadeIn 0.25s ease-out; }
        @keyframes luminaToggleFadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

        /* News toggle button (from helios — working mechanism) */
        .news-blog-container .news-item { margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid rgba(128,128,128,0.2); }
        .news-blog-container .news-item:last-child { border-bottom: 0; padding-bottom: 0; margin-bottom: 0; }
        .news-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
        .news-date { font-size: 0.85rem; opacity: 0.7; margin-bottom: 1rem; }
        .news-content-short, .news-content-full { line-height: 1.75; }
        .news-content-short p, .news-content-full p { margin-bottom: 1rem; }
        .news-content-short img, .news-content-full img { max-width: 100%; height: auto; border-radius: 8px; margin: 1rem 0; }
        .news-content-short ul, .news-content-full ul,
        .news-content-short ol, .news-content-full ol { margin: 0 0 1rem 1.5rem; }
        .news-content-short pre, .news-content-full pre { background: rgba(0,0,0,0.06); padding: 1rem; border-radius: 8px; overflow-x: auto; max-width: 100%; }
        .news-content-short code, .news-content-full code { font-family: 'Fira Code', monospace; font-size: 0.9em; }
        .news-content-short table, .news-content-full table { display: block; overflow-x: auto; max-width: 100%; }
        .toggle-news-btn {
            margin-top: 12px; background: #2563eb; color: #fff; border: 0;
            padding: 8px 18px; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: background 0.15s;
        }
        .toggle-news-btn:hover { background: #1d4ed8; }
        .news-item.is-expanded .news-content-short { display: none; }
        .news-item:not(.is-expanded) .news-content-full { display: none; }
        .news-item.is-expanded .news-content-full { display: block; }
        .lumina-toggle-block[data-lumina-toggle] { display: block; margin: 1rem 0; }
        .lumina-toggle-content { margin-top: 1rem; }
        html, body { max-width: 100%; overflow-x: clip; }

        /* When news has a Lumina toggle button, show .news-content-full
           regardless of is-expanded state. The Lumina button handles
           collapse/expand via lumina-toggle.js (wraps content after
           the button in hidden .lumina-toggle-content). */
        .news-item.has-lumina-toggle .news-content-full { display: block !important; }
        .news-item.has-lumina-toggle .news-content-short { display: none !important; }
        .news-item.has-lumina-toggle .toggle-news-btn:not([data-lumina-toggle] *) { display: none; }
</style>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>[x-cloak]{display:none!important}</style>
</head>
<body class="{{body_class}}">
    <div class="animated-bg" id="animated-bg"></div>
    <header class="navbar navbar-expand-lg fixed-top navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="?page=home&lang={{lang}}"><i class="fas fa-sun"></i> {{site_title}}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    {{foreach:pages as p}}
                    <li class="nav-item"><a class="nav-link {{if p.slug == page_slug}}active{{endif}}" href="?page={{p.slug}}&lang={{lang}}">{{p.title}}</a></li>
                    {{endforeach}}
                </ul>
            </div>
        </div>
    </header>
    <main class="main-content">
        <section class="hero-section">
            <div class="container"><div class="row justify-content-center"><div class="col-lg-8 fade-in-section"><div class="glass-panel text-center">
                <h1 class="hero-title">Энергия солнца в каждом проекте</h1>
                <p class="lead" style="font-family: var(--font-body);">Мы создаем цифровые решения, которые освещают путь к успеху</p>
                <div class="d-flex flex-wrap gap-3 mt-4 justify-content-center"><a href="?page=services" class="btn-theme">Наши лучи</a><a href="?page=contacts" class="btn btn-outline-light">Заказать солнце</a></div>
            </div></div></div></div>
        </section>
        <section class="py-5" style="padding-top: 120px !important;">
            <div class="container">

                </div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="container">
            <p>&copy; {{current_year}} {{site_title}} | Создано с солнечной энергией</p>
        </div>
    </footer>
    <script src="assets/js/bootstrap.bundle.local.js?v=20260718"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // [НОВЫЙ БЛОК] Логика для смены текста на кнопке "Читать далее"
            const readMoreButtons = document.querySelectorAll('.read-more-btn');
            readMoreButtons.forEach(button => {
                const collapseTarget = document.querySelector(button.getAttribute('href'));
                if (collapseTarget) {
                    collapseTarget.addEventListener('show.bs.collapse', function () {
                        button.textContent = 'Свернуть';
                    });
                    collapseTarget.addEventListener('hide.bs.collapse', function () {
                        button.textContent = 'Читать далее...';
                    });
                }
            });

            // Ваш остальной JS
            createSunRays();
            animateOnScroll();
            window.addEventListener('scroll', animateOnScroll);
        });

        function createSunRays() {
            const container = document.getElementById('animated-bg');
            if(!container) return;
            const rayCount = 60;
            for (let i = 0; i < rayCount; i++) {
                const ray = document.createElement('div');
                ray.className = 'sun-ray';
                const angle = (360 / rayCount) * i;
                ray.style.transform = `rotate(${angle}deg)`;
                ray.style.transformOrigin = 'top center';
                const duration = 5 + Math.random() * 4;
                const delay = Math.random() * 5;
                ray.style.animationDuration = `${duration}s`;
                ray.style.animationDelay = `${delay}s`;
                ray.style.left = `${Math.random() * 100}%`;
                container.appendChild(ray);
            }
        }
        function animateOnScroll() {
            const elements = document.querySelectorAll('.fade-in-section');
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const windowHeight = window.innerHeight;
                if (elementTop < windowHeight * 0.9) {
                    element.classList.add('is-visible');
                }
            });
        }
    </script>
    
    <script src="assets/js/lumina-toggle.js?v=20260715" defer></script>
    <script src="assets/js/legacy-bs-toggle.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        document.addEventListener('click', function(event) {
            var target = event.target;
            if (!target.matches || !target.matches('.toggle-news-btn')) return;

            // 1. Lumina toggle button (inside [data-lumina-toggle])
            var luminaToggle = target.closest('[data-lumina-toggle]');
            if (luminaToggle) {
                var content = luminaToggle.querySelector('.lumina-toggle-content');
                if (!content && luminaToggle.nextElementSibling && luminaToggle.nextElementSibling.classList.contains('lumina-toggle-content')) {
                    content = luminaToggle.nextElementSibling;
                }
                if (content) {
                    var isHidden = content.style.display === 'none' || getComputedStyle(content).display === 'none';
                    content.style.display = isHidden ? 'block' : 'none';
                    var expandedText  = target.getAttribute('data-text-expanded')  || 'Свернуть';
                    var collapsedText = target.getAttribute('data-text-collapsed') || 'Читать далее';
                    target.textContent = isHidden ? expandedText : collapsedText;
                }
                event.preventDefault();
                event.stopPropagation();
                return;
            }

            // 2. Legacy toggle button (from latest_news.php widget)
            var newsItem = target.closest('.news-item');
            if (newsItem) {
                newsItem.classList.toggle('is-expanded');
                target.textContent = newsItem.classList.contains('is-expanded') ? 'Свернуть' : 'Читать далее';
                event.preventDefault();
            }
        });
    });
    </script>
    <script src="assets/js/lightbox.js?v=20260715b" defer></script>
</body>
</html>
