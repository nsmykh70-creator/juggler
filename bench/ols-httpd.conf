# OpenLiteSpeed benchmark main config. Mounted as
# /usr/local/lsws/conf/httpd_config.conf in the litespeedtech image.
# One vhost proxying everything to the static backend.

user                    nobody
group                   nogroup

# Comparable CPU posture: 2 workers (nginx/apache/haproxy use 2 too).
cpuAffinity             2

mime                    $SERVER_ROOT/conf/mime.properties

errorlog $SERVER_ROOT/logs/error.log WARN {
    useServer           1
    logHeaders          0
}

accesslog $SERVER_ROOT/logs/access.log {
    rollingSize         0
}

# --- Anti-DoS per-client throttling: the default 100-conn hard limit per
# client IP + bot detection (OverConnHardLimit) tore down wrk's 10 000
# connections from ONE load-generator IP. The OLS manual explicitly says:
# "Set to a high value when you are performing benchmark tests". Trusted
# IPs bypass these limits, but the docker bridge IP is not trusted by
# default, so the limits themselves are raised.
perClientConnLimit {
    staticReqPerSec     0
    dynReqPerSec        0
    outboundBandwidth   0
    outboundSoftLimit   0
    inReqSoftLimit      0
    inReqHardLimit      0
    connSoftLimit       20000
    hardLimit           20000
    gracePeriod         600
    bannedPeriod        60
    strictRenewPerSec   0
    dropConnOnOverload  0
}

listener bench8087 {
    address             *:8087
    secure              0
    map                 benchvh *
}

virtualhost benchvh {
    vhRoot              /usr/local/lsws/Example
    configFile          conf/bench-vh.conf
    allowSymbolLink     1
    enableScript        0
    restrained          0
}
