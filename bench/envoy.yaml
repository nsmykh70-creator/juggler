admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8085
      # Downstream connection limit: without an explicit limit the listener
      # accepts everything, but each worker's per-connection buffer and the
      # default 1024-connection circuit breaker then become the bottleneck
      # at 10k concurrent conns.
      per_connection_buffer_limit_bytes: 32768
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: bench
                codec_type: AUTO
                stream_idle_timeout: 30s
                route_config:
                  name: local_routes
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: origin
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: origin
      type: STRICT_DNS
      connect_timeout: 5s
      lb_policy: LEAST_REQUEST
      # Circuit breakers: the DEFAULTS are the bottleneck at 10k conns —
      # max_connections 1024 and max_pending_requests 1024 turn every
      # excess stream into a 503 "upstream_cx_overflow" (28k overflows +
      # 150k pending overflows observed in the first matrix). Raised to
      # comfortably above the storm size.
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 16384
            max_pending_requests: 16384
            max_requests: 16384
            max_retries: 32
      # Keep-alive upstream pool (default closes per request).
      common_http_protocol_options:
        idle_timeout: 300s
      upstream_connection_options:
        tcp_keepalive: {}
      load_assignment:
        cluster_name: origin
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: backend
                      port_value: 9000
