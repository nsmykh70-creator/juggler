worker_processes auto;
events { worker_connections 20000; }

http {
    access_log off;
    keepalive_timeout 65;
    keepalive_requests 10000000;

    upstream backend_up {
        server backend:9000;
        keepalive 512;
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://backend_up;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
