# Apache httpd benchmark config: reverse proxy with an upstream keep-alive
# connection pool, the same role nginx/juggler play in the matrix.
ServerRoot "/usr/local/apache2"
Listen 8082
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule env_module modules/mod_env.so
LoadModule setenvif_module modules/mod_setenvif.so

User daemon
Group daemon
ServerName bench-apache
LogLevel warn
ErrorLog /dev/null
CustomLog /dev/null common
PidFile /usr/local/apache2/logs/httpd.pid

<IfModule mpm_event_module>
    StartServers 2
    ServerLimit 16
    ThreadsPerChild 75
    MaxRequestWorkers 1200
</IfModule>

ProxyRequests Off
ProxyPreserveHost Off
SetEnv proxy-nokeepalive 0
SetEnv proxy-sendchunked 0

<Proxy "http://backend:9000">
    ProxySet connectiontimeout=3 timeout=30 keepalive=On retry=30
</Proxy>

ProxyPass        "/" "http://backend:9000/"
ProxyPassReverse "/" "http://backend:9000/"
