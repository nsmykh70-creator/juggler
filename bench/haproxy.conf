# HAProxy benchmark config: plain-HTTP reverse proxy on :8084 forwarding to
# the static backend. Keep-alive on both sides, event-driven by design.
global
    log stdout format raw local0
    maxconn 65536
    nbthread 2              # match the 2 workers of nginx/apache for fairness

defaults
    log     global
    mode    http
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    option httplog
    option http-keep-alive

frontend fe
    bind *:8084
    default_backend be

backend be
    # Reuse upstream connections: without this HAProxy opens a fresh
    # connection per request and the comparison vs nginx/juggler is unfair.
    http-reuse always
    server origin backend:9000 check inter 2s fall 3 rise 2 maxconn 8192
