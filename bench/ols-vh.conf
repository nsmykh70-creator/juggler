# OpenLiteSpeed benchmark vhost: proxy everything to the static origin.
# NOTE: OLS config is case/format sensitive — directives verified against
# LiteSpeed/1.9.2 PlainConf parser error logs.
docRoot                   $VH_ROOT/html

extProcessor origin {
    type                  proxy
    address               backend:9000
    maxConns              4096
    initTimeout           5
    retryTimeout          0
    pcKeepAliveTimeout    300
}

context / {
    type                  proxy
    handler               origin
    addDefaultCharset     off
}
