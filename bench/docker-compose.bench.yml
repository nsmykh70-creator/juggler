# One-shot benchmark topology: everything runs inside one docker network so
# wrk traffic never crosses the host NAT.
#   Start:    docker compose -f bench/docker-compose.bench.yml up -d
#   Teardown: docker compose -f bench/docker-compose.bench.yml down -v

services:
  # ---------- Juggler (image built from this repo) ----------
  juggler:
    image: juggler:bench
    container_name: bench-juggler
    ports:
      - "50051:50051"   # host grpc_client.py access for hot-reload
      - "127.0.0.1:19090:9090"  # host admin-API access for bench runners
      - "127.0.0.1:8080:8080"   # data plane (plain) reachable from the host browser
    volumes:
      # Persistent routes: container restarts keep admin-added routes. Bind-
      # mounted because the image itself carries no routes.json (a fresh
      # container would otherwise lose every admin-created route).
      - ./routes.json:/app/routes.json
    environment:
      JUGGLER_HTTP_ADDR: 0.0.0.0:8443
      JUGGLER_GRPC_ADDR: 0.0.0.0:50051
      JUGGLER_PLAIN_HTTP_ADDR: 0.0.0.0:8080   # wrk cannot speak TLS
      # The admin UI must be reachable through the 19090 port mapping.
      JUGGLER_ADMIN_ADDR: 0.0.0.0:9090
      # Benchmark mode: the per-IP token bucket is a DoS guard, not a bench
      # knob; a load test from one IP would throttle itself immediately.
      JUGGLER_RATE_LIMIT_TOKENS: "1000000"
      JUGGLER_RATE_LIMIT_REFILL: "1000000"
      JUGGLER_MAX_KEEPALIVE_REQUESTS: "10000000"
      # 10k in-flight requests need a proportional upstream socket pool,
      # otherwise excess connections churn (close + reconnect per response).
      JUGGLER_UPSTREAM_POOL_PER_UPSTREAM: "4096"
    sysctls:
      # Deep accept backlog for sharded SO_REUSEPORT listeners: without this
      # the kernel caps every listen() backlog at 128/4096 and storms drop.
      - net.core.somaxconn=8192
      - net.ipv4.tcp_max_syn_backlog=8192
    networks: [bench]

  # ---------- nginx (same role: TLS-terminating reverse proxy) ----------
  nginx:
    image: nginx:alpine
    container_name: bench-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [bench]

  # ---------- Apache httpd (same role: reverse proxy) ----------
  apache:
    image: httpd:2.4-alpine
    container_name: bench-apache
    volumes:
      - ./apache.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks: [bench]

  # ---------- Caddy (same role: reverse proxy) ----------
  caddy:
    image: caddy:2-alpine
    container_name: bench-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [bench]

  # ---------- HAProxy (same role: reverse proxy) ----------
  haproxy:
    image: haproxy:2.9-alpine
    container_name: bench-haproxy
    volumes:
      - ./haproxy.conf:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks: [bench]

  # ---------- Envoy (same role: reverse proxy) ----------
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: bench-envoy
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    networks: [bench]

  # ---------- Traefik v3 (same role: reverse proxy) ----------
  traefik:
    image: traefik:v3.1
    container_name: bench-traefik
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [bench]

  # ---------- OpenLiteSpeed (same role: reverse proxy) ----------
  openlitespeed:
    image: litespeedtech/openlitespeed:latest
    container_name: bench-ols
    volumes:
      # Not :ro — the OLS entrypoint chowns/chmods its configs on start.
      - ./ols-httpd.conf:/usr/local/lsws/conf/httpd_config.conf
      - ./ols-vh.conf:/usr/local/lsws/conf/bench-vh.conf
    networks: [bench]

  # ---------- Static upstream both proxies forward to ----------
  # nginx static server: far cheaper than any dynamic backend, so proxy
  # benchmarks measure the proxies, not the origin. Always 200.
  backend:
    image: nginx:alpine
    container_name: bench-backend
    volumes:
      - ./backend.conf:/etc/nginx/conf.d/default.conf:ro
    command: ["nginx", "-g", "daemon off;"]
    networks: [bench]

  # ---------- Load generator (idle; exec wrk inside it) ----------
  wrk:
    image: williamyeh/wrk
    container_name: bench-wrk
    entrypoint: ["tail", "-f", "/dev/null"]
    networks: [bench]

networks:
  bench:
    driver: bridge
